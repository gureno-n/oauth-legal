<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>OAuth callback — rclone setup</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 720px; margin: 0 auto; padding: 48px 20px; line-height: 1.7; color: #222; background: #fff; }
  h1 { font-size: 1.5rem; }
  pre { background: #f4f4f4; border: 1px solid #ddd; border-radius: 8px; padding: 16px; white-space: pre-wrap; word-break: break-all; font-size: 0.95rem; }
  button { font-size: 1rem; padding: 10px 18px; border: 0; border-radius: 8px; background: #0b57d0; color: #fff; cursor: pointer; }
  button:active { opacity: 0.8; }
  .error { color: #b3261e; }
  footer { margin-top: 2rem; font-size: 0.9rem; color: #666; }
  @media (prefers-color-scheme: dark) {
    body { color: #e8e8e8; background: #111; }
    pre { background: #1e1e1e; border-color: #333; }
    footer { color: #aaa; }
  }
</style>
</head>
<body>
<h1>OAuth callback</h1>
<p>Copy the authorization code below and paste it into the rclone setup chat. The code is single-use and expires shortly.</p>
<pre id="code">Loading...</pre>
<button id="copy" type="button">Copy code</button>
<p id="error" class="error"></p>
<footer>
  <p><a href="./">Back to home</a></p>
</footer>
<script>
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const error = params.get('error');
  const codeEl = document.getElementById('code');
  const errorEl = document.getElementById('error');
  const copyBtn = document.getElementById('copy');

  if (error) {
    codeEl.textContent = 'No code.';
    errorEl.textContent = 'Error: ' + error + (params.get('error_description') ? ' — ' + params.get('error_description') : '');
    copyBtn.disabled = true;
  } else if (code) {
    codeEl.textContent = code;
  } else {
    codeEl.textContent = 'No code found in the URL.';
    copyBtn.disabled = true;
  }

  copyBtn.addEventListener('click', async () => {
    if (!code) return;
    try {
      await navigator.clipboard.writeText(code);
    } catch (e) {
      const range = document.createRange();
      range.selectNodeContents(codeEl);
      const sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      document.execCommand('copy');
    }
    copyBtn.textContent = 'Copied';
  });
</script>
</body>
</html>
